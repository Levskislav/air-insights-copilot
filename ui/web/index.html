<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Air & Insights Copilot</title>
    <link rel="stylesheet" href="styles.css">
    <!-- Google Font: Outfit for modern look -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
</head>
<body>
    <!-- Animated background -->
    <div class="bg-grid"></div>
    <div class="bg-glow"></div>

    <div class="container">
        <!-- Header -->
        <header class="header">
            <div class="logo">
                <span class="logo-icon">🌬️</span>
                <h1>Air & Insights</h1>
            </div>
            <p class="tagline">AI-powered air quality guidance</p>
        </header>

        <!-- Main Content -->
        <main class="main-content">
            <!-- Input Card -->
            <section class="card input-card">
                <h2>📍 Location Analysis</h2>
                <form id="analyze-form">
                    <div class="form-grid">
                        <div class="form-group">
                            <label for="latitude">Latitude</label>
                            <input type="number" id="latitude" name="latitude" 
                                   step="0.0001" min="-90" max="90" 
                                   value="42.6977" required
                                   placeholder="e.g. 42.6977">
                        </div>
                        <div class="form-group">
                            <label for="longitude">Longitude</label>
                            <input type="number" id="longitude" name="longitude" 
                                   step="0.0001" min="-180" max="180" 
                                   value="23.3219" required
                                   placeholder="e.g. 23.3219">
                        </div>
                        <div class="form-group">
                            <label for="hours">Hours</label>
                            <input type="number" id="hours" name="hours" 
                                   min="1" max="168" value="6" required
                                   placeholder="1-168">
                        </div>
                    </div>
                    
                    <!-- Quick location buttons -->
                    <div class="quick-locations">
                        <button type="button" class="quick-btn" data-lat="42.6977" data-lon="23.3219">Sofia 🇧🇬</button>
                        <button type="button" class="quick-btn" data-lat="48.8566" data-lon="2.3522">Paris 🇫🇷</button>
                        <button type="button" class="quick-btn" data-lat="40.7128" data-lon="-74.0060">New York 🇺🇸</button>
                        <button type="button" class="quick-btn" data-lat="35.6762" data-lon="139.6503">Tokyo 🇯🇵</button>
                    </div>

                    <button type="submit" class="submit-btn" id="submit-btn">
                        <span class="btn-text">Analyze Air Quality</span>
                        <span class="btn-loading">Analyzing...</span>
                    </button>
                </form>
            </section>

            <!-- Results Section (hidden until data) -->
            <section class="results-section" id="results-section">
                <!-- Metrics Cards -->
                <div class="metrics-grid">
                    <div class="metric-card pm25">
                        <div class="metric-icon">🔴</div>
                        <div class="metric-value" id="pm25-value">--</div>
                        <div class="metric-label">PM2.5</div>
                        <div class="metric-unit">µg/m³</div>
                    </div>
                    <div class="metric-card pm10">
                        <div class="metric-icon">🟠</div>
                        <div class="metric-value" id="pm10-value">--</div>
                        <div class="metric-label">PM10</div>
                        <div class="metric-unit">µg/m³</div>
                    </div>
                    <div class="metric-card temp">
                        <div class="metric-icon">🌡️</div>
                        <div class="metric-value" id="temp-value">--</div>
                        <div class="metric-label">Temperature</div>
                        <div class="metric-unit">°C</div>
                    </div>
                </div>

                <!-- AI Guidance Card -->
                <div class="card guidance-card">
                    <h3>🤖 AI Guidance</h3>
                    <div class="guidance-text" id="guidance-text">
                        <!-- AI guidance will appear here -->
                    </div>
                </div>
            </section>

            <!-- NASA APOD Section -->
            <section class="card apod-card" id="apod-section">
                <div class="apod-header">
                    <h3>🚀 NASA Picture of the Day</h3>
                    <button type="button" class="apod-btn" id="apod-btn">Load APOD</button>
                </div>
                <div class="apod-content" id="apod-content">
                    <!-- APOD content will appear here -->
                </div>
            </section>
        </main>

        <!-- Footer -->
        <footer class="footer">
            <p>Weather data by <a href="https://open-meteo.com" target="_blank">Open-Meteo.com</a></p>
            <p class="footer-sub">Powered by GitHub Models • Built with FastAPI</p>
        </footer>
    </div>

    <!-- Error Toast -->
    <div class="toast" id="error-toast">
        <span class="toast-icon">⚠️</span>
        <span class="toast-message" id="toast-message">Error message</span>
    </div>

    <script src="app.js"></script>
</body>
</html>
